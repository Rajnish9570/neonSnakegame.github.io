<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1014">
<title>Snake X — Neon Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --accent:#52e6a1;
 --bg:#0b1014;
 --panel:#11191e;
 --muted:#8b999f;
 --border:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;
 background:radial-gradient(ellipse at 50% -25%,rgba(36,105,78,.28),transparent 58%),var(--bg);
 color:#f3f7f5;font-family:"DM Sans",sans-serif;padding:32px 18px 40px;
}
button{font:inherit;cursor:pointer}
.app{max-width:1000px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:42px;height:42px;display:grid;place-items:center;background:rgba(82,230,161,.1);border:1px solid rgba(82,230,161,.2);border-radius:13px;font-size:21px}
.brand h1{font:700 20px "Space Grotesk",sans-serif;letter-spacing:.4px}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--muted);font-size:10px;letter-spacing:1.6px;margin-top:3px}
.header-right{display:flex;gap:9px;align-items:center}
.icon-btn{width:40px;height:40px;background:var(--panel);border:1px solid var(--border);border-radius:11px;color:#f3f7f5;font-size:17px}
.icon-btn:hover,.secondary:hover{border-color:rgba(82,230,161,.4)}
.live{font-size:10px;letter-spacing:.8px;color:var(--accent);padding:9px 12px;border:1px solid rgba(82,230,161,.22);border-radius:30px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.game-area{min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}
.stat{padding:13px 15px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:1px}
.stat strong{display:block;font:600 20px "Space Grotesk",sans-serif;color:var(--accent);margin-top:7px}
.board{background:#0d1519;padding:9px;border:1px solid rgba(82,230,161,.2);border-radius:15px;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:9px;background:#091116;touch-action:none}
.overlay{position:absolute;inset:9px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:9px;background:rgba(5,12,16,.91);backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.overlay .emoji{font-size:42px;margin-bottom:13px}
.overlay h2{font:700 clamp(22px,5vw,32px) "Space Grotesk",sans-serif;color:var(--accent);margin-bottom:10px}
.overlay p{font-size:12px;line-height:1.7;color:#aab6b8;margin-bottom:19px;max-width:310px}
.primary{background:var(--accent);color:#07130c;border:0;border-radius:9px;padding:13px 22px;font-size:11px;font-weight:700;letter-spacing:.7px;transition:transform .2s,filter .2s}
.primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
.secondary{padding:11px 15px;border-radius:9px;color:#e5ece9;background:var(--panel);border:1px solid var(--border);font-weight:600;font-size:11px;transition:border-color .2s}
.action-row{display:flex;gap:9px;margin-top:12px}
.action-row button{flex:1}
.sidebar{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:16px}
.card h3{font-size:11px;font-weight:600;letter-spacing:.7px;margin-bottom:14px}
.card-label{color:var(--muted);font-size:9px;letter-spacing:1px;display:block;margin-bottom:9px}
.difficulty-list{display:grid;gap:7px}
.diff{display:flex;align-items:center;justify-content:space-between;padding:11px;border:1px solid var(--border);background:#0d1519;color:#b5c0c1;border-radius:8px;font-size:11px;transition:.2s}
.diff:hover{border-color:rgba(82,230,161,.3)}
.diff.active{border-color:var(--accent);background:rgba(82,230,161,.08);color:var(--accent)}
.diff small{font-size:9px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.theme{height:32px;border:2px solid transparent;border-radius:8px}
.theme.active{border-color:#fff;outline:2px solid var(--accent)}
.green{background:#42f59b}.blue{background:#43b7ff}.purple{background:#bd75ff}.gold{background:#ffc94a}
.setting{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:#c0cbca}
.switch{width:36px;height:20px;border-radius:20px;border:0;background:#34414b;padding:3px}
.switch:after{content:"";display:block;height:14px;width:14px;background:white;border-radius:50%;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(16px)}
.progress{height:5px;background:#26333d;border-radius:10px;overflow:hidden;margin:11px 0 7px}
.progress-fill{height:100%;width:0%;background:var(--accent);transition:width .3s}
.progress-text{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.milestone-value{font:600 18px "Space Grotesk",sans-serif;color:var(--accent)}
.controls{display:none;width:180px;margin:18px auto 0;grid-template-columns:repeat(3,1fr);gap:8px}
.controls button{height:47px;border-radius:10px;background:#14251e;color:var(--accent);border:1px solid rgba(82,230,161,.25);font-size:21px}
.controls button:active{background:var(--accent);color:#000}
.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
footer{margin-top:25px;padding-top:15px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:10px;flex-wrap:wrap}
footer span{color:var(--accent)}
body.playing{padding-top:15px;padding-bottom:15px}
body.playing header,body.playing .sidebar,body.playing footer{display:none!important}
body.playing .app{max-width:650px}
body.playing .layout{display:block}
body.playing .game-area{width:100%}
body.playing .controls{display:grid}
@media(max-width:750px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats{gap:7px}.stat{padding:11px 8px}.stat strong{font-size:16px}.stat small{font-size:8px}.controls{display:grid}
}
@media(max-width:430px){
 body{padding:18px 11px}.brand h1{font-size:17px}.brand-icon{width:37px;height:37px}.live{display:none}.sidebar{grid-template-columns:1fr}.action-row button{font-size:10px;padding:11px 5px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand">
  <div class="brand-icon">🐍</div>
  <div><h1>SNAKE<span> X</span></h1><p>NEON SNAKE</p></div>
 </div>
 <div class="header-right">
  <div class="live">● READY TO PLAY</div>
  <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">♫</button>
 </div>
</header>
<div class="layout">
<main class="game-area">
 <div class="stats">
  <div class="stat"><small>SCORE</small><strong id="score">000</strong></div>
  <div class="stat"><small>BEST</small><strong id="best">000</strong></div>
  <div class="stat"><small>LEVEL</small><strong id="level">01</strong></div>
  <div class="stat"><small id="speedLabel">SPEED</small><strong id="speed">1x</strong></div>
 </div>
 <div class="board">
  <canvas id="game" width="500" height="500"></canvas>
  <div class="overlay" id="overlay">
   <div class="emoji" id="overlayEmoji">🐍</div>
   <h2 id="overlayTitle">SNAKE X</h2>
   <p id="overlayText">Collect food, grow your snake, and beat your best score.</p>
   <button class="primary" id="startBtn">START PLAYING →</button>
  </div>
 </div>
 <div class="action-row">
  <button class="secondary" id="pauseBtn">Ⅱ &nbsp; PAUSE</button>
  <button class="secondary" id="restartBtn">↻ &nbsp; RESTART</button>
 </div>
 <div class="controls">
  <button class="up" data-dir="up" aria-label="Up">↑</button>
  <button class="left" data-dir="left" aria-label="Left">←</button>
  <button class="down" data-dir="down" aria-label="Down">↓</button>
  <button class="right" data-dir="right" aria-label="Right">→</button>
 </div>
</main>
<aside class="sidebar">
 <section class="card">
  <h3>DIFFICULTY</h3>
  <div class="difficulty-list">
   <button class="diff active" data-diff="easy"><span>Easy</span><small>No timer</small></button>
   <button class="diff" data-diff="medium"><span>Medium</span><small>No timer</small></button>
   <button class="diff" data-diff="hard"><span>Hard</span><small>60 seconds</small></button>
  </div>
 </section>
 <section class="card">
  <h3>APPEARANCE</h3>
  <span class="card-label">SNAKE COLOR</span>
  <div class="themes">
   <button class="theme green active" data-theme="green" aria-label="Green snake"></button>
   <button class="theme blue" data-theme="blue" aria-label="Blue snake"></button>
   <button class="theme purple" data-theme="purple" aria-label="Purple snake"></button>
   <button class="theme gold" data-theme="gold" aria-label="Gold snake"></button>
  </div>
  <div class="setting">
   <span>Sound effects</span>
   <button class="switch on" id="soundSwitch" aria-label="Toggle sound effects"></button>
  </div>
 </section>
 <section class="card">
  <h3>NEXT MILESTONE</h3>
  <strong id="milestone" class="milestone-value">50 PTS</strong>
  <div class="progress"><div class="progress-fill" id="progress"></div></div>
  <div class="progress-text">
   <span id="progressCurrent">0 points</span>
   <span id="progressTarget">50 points</span>
  </div>
 </section>
</aside>
</div>
<footer>
 <div>© 2026 <span>SNAKE X</span></div>
 <div>Use arrow keys or WASD to move · Space to pause</div>
</footer>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const N=25,CELL=20;

const palettes={
 green:{main:"#42f59b",light:"#c1ffdf",dark:"#0cba66"},
 blue:{main:"#43b7ff",light:"#d3f1ff",dark:"#147ed0"},
 purple:{main:"#bd75ff",light:"#f0d7ff",dark:"#853ad1"},
 gold:{main:"#ffc94a",light:"#fff0bd",dark:"#d99b17"}
};

const difficulties={
 easy:{base:150,min:70,wrap:true,time:0},
 medium:{base:125,min:60,wrap:true,time:0},
 hard:{base:100,min:48,wrap:true,time:60}
};

let difficulty="easy",theme="green",sound=true;
let snake,food,bonusFood,direction,nextDirection;
let score=0,level=1,foodCount=0;
let running=false,paused=false,over=false;
let bonusUntil=0,particles=[];
let audioContext=null;
let lastTime=0,accumulator=0;
let timeLeft=0,countdownInterval=null;

const $=id=>document.getElementById(id);

function getBest(){
 return Number(localStorage.getItem("snakeX_best_"+difficulty))||0;
}
function setBest(v){
 localStorage.setItem("snakeX_best_"+difficulty,v);
}
function speedDelay(){
 const d=difficulties[difficulty];
 return Math.max(d.min,d.base-(level-1)*8);
}
function playSound(freq=500,duration=.08,type="sine"){
 if(!sound)return;
 try{
  audioContext ||= new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.type=type;osc.frequency.value=freq;
  gain.gain.setValueAtTime(.09,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.start();osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}

function updateStats(){
 $("score").textContent=String(score).padStart(3,"0");
 $("best").textContent=String(getBest()).padStart(3,"0");
 $("level").textContent=String(level).padStart(2,"0");

 if(difficulty==="hard"){
  $("speedLabel").textContent="TIME LEFT";
  $("speed").textContent=String(Math.floor(timeLeft/60)).padStart(2,"0")+":"+String(timeLeft%60).padStart(2,"0");
 }else{
  $("speedLabel").textContent="SPEED";
  $("speed").textContent=Math.max(1,Math.round(difficulties[difficulty].base/speedDelay()))+"x";
 }

 const target=Math.floor(score/50+1)*50;
 $("milestone").textContent=target+" PTS";
 $("progress").style.width=(score%50)/50*100+"%";
 $("progressCurrent").textContent=score+" points";
 $("progressTarget").textContent=target+" points";
}

function spawnFood(){
 do{
  food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 }while(snake.some(p=>p.x===food.x&&p.y===food.y));
}

function spawnBonus(){
 if(bonusFood)return;
 do{
  bonusFood={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
 }while(snake.some(s=>s.x===bonusFood.x&&s.y===bonusFood.y)||
  (bonusFood.x===food.x&&bonusFood.y===food.y));
 bonusUntil=Date.now()+7000;
}

function reset(){
 clearInterval(countdownInterval);
 snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
 direction={x:1,y:0};nextDirection={x:1,y:0};
 score=0;level=1;foodCount=0;
 running=false;paused=false;over=false;
 bonusFood=null;particles=[];
 timeLeft=difficulties[difficulty].time;
 $("pauseBtn").textContent="Ⅱ  PAUSE";
 document.body.classList.remove("playing");
 spawnFood();updateStats();render();
}

function hideOverlay(){
 $("overlay").classList.add("hidden");
}

function showOverlay(emoji,title,description,button){
 $("overlayEmoji").textContent=emoji;
 $("overlayTitle").textContent=title;
 $("overlayText").innerHTML=description;
 $("startBtn").textContent=button;
 $("overlay").classList.remove("hidden");
}

function startCountdown(){
 clearInterval(countdownInterval);
 if(difficulty!=="hard")return;

 countdownInterval=setInterval(()=>{
  if(!running||paused||over)return;

  timeLeft--;
  updateStats();

  if(timeLeft<=0){
   timeLeft=0;
   updateStats();
   endGame("time");
  }
 },1000);
}

function start(){
 if(paused){
  paused=false;
  running=true;
  document.body.classList.add("playing");
  hideOverlay();
  $("pauseBtn").textContent="Ⅱ  PAUSE";
  lastTime=performance.now();
  accumulator=0;
  startCountdown();
  requestAnimationFrame(loop);
  return;
 }

 if(over)reset();
 if(running)return;

 running=true;paused=false;
 document.body.classList.add("playing");
 hideOverlay();
 lastTime=performance.now();
 accumulator=0;
 startCountdown();
 requestAnimationFrame(loop);
}

function endGame(reason="collision"){
 if(over)return;
 running=false;paused=false;over=true;
 clearInterval(countdownInterval);
 document.body.classList.remove("playing");
 playSound(120,.4,"sawtooth");

 const message=reason==="time"
  ?"Your 60-second challenge is over!"
  :"You collided with your own body!";

 showOverlay("💥","GAME OVER",
  `${message}<br><br>Final score: <b style="color:${palettes[theme].main}">${score}</b><br>Best score: <b>${getBest()}</b>`,
  "PLAY AGAIN →");
}

function togglePause(){
 if(!running&&!paused)return;

 if(!paused){
  paused=true;running=false;
  clearInterval(countdownInterval);
  document.body.classList.remove("playing");
  $("pauseBtn").textContent="▶ RESUME";
  showOverlay("⏸️","GAME PAUSED","Take a break. Your progress and remaining time are safe!","RESUME GAME →");
 }else{
  start();
 }
}

function setDirection(name){
 const dirs={
  up:{x:0,y:-1},down:{x:0,y:1},
  left:{x:-1,y:0},right:{x:1,y:0}
 };
 const d=dirs[name];
 if(!d)return;
 if(d.x===-direction.x&&d.y===-direction.y)return;
 nextDirection=d;
 if(!running&&!paused&&!over)start();
}

function particlesAt(x,y,color){
 for(let i=0;i<10;i++){
  particles.push({
   x:x*CELL+10,y:y*CELL+10,
   vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,
   life:1,color
  });
 }
}

function step(){
 direction=nextDirection;

 const head={
  x:(snake[0].x+direction.x+N)%N,
  y:(snake[0].y+direction.y+N)%N
 };

 const regular=head.x===food.x&&head.y===food.y;
 const bonus=bonusFood&&head.x===bonusFood.x&&head.y===bonusFood.y;
 const grows=regular||bonus;

 // Wall wrapping is enabled in all three modes.
 // Only collision with the snake's own body ends the game.
 const body=grows?snake:snake.slice(0,-1);

 if(body.some(p=>p.x===head.x&&p.y===head.y)){
  endGame();return;
 }

 snake.unshift(head);

 if(regular){
  score+=10;foodCount++;
  particlesAt(food.x,food.y,"#ff456d");
  playSound(700,.09);
  spawnFood();

  if(foodCount%5===0){
   level++;
   playSound(950,.2,"triangle");
  }
 }else if(bonus){
  score+=30;
  particlesAt(bonusFood.x,bonusFood.y,"#ffc94a");
  bonusFood=null;
  playSound(1000,.25,"triangle");
 }else{
  snake.pop();
 }

 if(score>getBest())setBest(score);
 updateStats();
}

function drawBackground(){
 ctx.fillStyle="#091116";
 ctx.fillRect(0,0,500,500);
 ctx.strokeStyle="rgba(255,255,255,.035)";
 for(let i=0;i<=500;i+=CELL){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,500);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(500,i);ctx.stroke();
 }
}

function drawFood(){
 const x=food.x*CELL+10,y=food.y*CELL+10;
 ctx.shadowBlur=20;ctx.shadowColor="#ff456d";
 const g=ctx.createRadialGradient(x-3,y-3,1,x,y,9);
 g.addColorStop(0,"#fff");g.addColorStop(.3,"#ff9caf");g.addColorStop(1,"#ff345e");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
}

function drawBonus(){
 if(!bonusFood)return;
 const x=bonusFood.x*CELL+10,y=bonusFood.y*CELL+10;
 const pulse=7+Math.sin(Date.now()/100)*2;
 ctx.save();ctx.shadowColor="#ffc94a";ctx.shadowBlur=24;
 ctx.fillStyle="#ffc94a";ctx.beginPath();ctx.arc(x,y,pulse,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.fillStyle="#593d00";
 ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText("★",x,y);ctx.restore();
}

function drawSnake(){
 const p=palettes[theme];
 snake.forEach((part,i)=>{
  const x=part.x*CELL+2,y=part.y*CELL+2,s=CELL-4;
  ctx.shadowColor=p.main;ctx.shadowBlur=i===0?18:6;
  const g=ctx.createLinearGradient(x,y,x+s,y+s);
  g.addColorStop(0,i===0?p.light:p.main);
  g.addColorStop(1,p.dark);
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,s,s,5);ctx.fill();

  if(i===0){
   ctx.shadowBlur=0;ctx.fillStyle="#07150e";
   let eyes;
   if(direction.x===1)eyes=[[14,5],[14,13]];
   else if(direction.x===-1)eyes=[[4,5],[4,13]];
   else if(direction.y===-1)eyes=[[5,4],[13,4]];
   else eyes=[[5,14],[13,14]];
   eyes.forEach(([a,b])=>{
    ctx.beginPath();ctx.arc(x+a,y+b,2,0,Math.PI*2);ctx.fill();
   });
  }
 });
 ctx.shadowBlur=0;
}

function drawParticles(){
 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;p.life-=.04;
  ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,3,3);
 });
 ctx.globalAlpha=1;
}

function render(){
 drawBackground();drawFood();drawBonus();drawSnake();drawParticles();
}

function loop(now){
 if(!running)return;
 const delta=Math.min(now-lastTime,100);
 lastTime=now;
 accumulator+=delta;

 if(bonusFood&&Date.now()>bonusUntil)bonusFood=null;

 while(accumulator>=speedDelay()&&running){
  step();
  accumulator-=speedDelay();
 }
 render();
 if(running)requestAnimationFrame(loop);
}

function setDifficulty(d){
 if(!difficulties[d])return;
 difficulty=d;
 document.querySelectorAll(".diff").forEach(b=>{
  b.classList.toggle("active",b.dataset.diff===d);
 });
 reset();
 showOverlay("🐍", "SNAKE X",
  `${d.toUpperCase()} MODE SELECTED<br>
  ${d==="hard"?"60-second timer and wall wrapping enabled.":d==="medium"?"Wall wrapping enabled. No time limit.":"Classic gameplay with no time limit."}`,
  "START PLAYING →");
}

function setTheme(t){
 if(!palettes[t])return;
 theme=t;
 const rgb={
  green:"66,245,155",blue:"67,183,255",
  purple:"189,117,255",gold:"255,201,74"
 };
 document.documentElement.style.setProperty("--accent",palettes[t].main);
 document.documentElement.style.setProperty("--accent-rgb",rgb[t]);
 document.querySelectorAll(".theme").forEach(b=>{
  b.classList.toggle("active",b.dataset.theme===t);
 });
 render();
}

function toggleSound(){
 sound=!sound;
 $("soundBtn").textContent=sound?"♫":"🔇";
 $("soundSwitch").classList.toggle("on",sound);
 if(sound)playSound(650,.1);
}

$("startBtn").addEventListener("click",start);
$("pauseBtn").addEventListener("click",togglePause);
$("restartBtn").addEventListener("click",()=>{reset();start()});
$("soundBtn").addEventListener("click",toggleSound);
$("soundSwitch").addEventListener("click",toggleSound);

document.querySelectorAll(".diff").forEach(b=>{
 b.addEventListener("click",()=>setDifficulty(b.dataset.diff));
});
document.querySelectorAll(".theme").forEach(b=>{
 b.addEventListener("click",()=>setTheme(b.dataset.theme));
});
document.querySelectorAll("[data-dir]").forEach(b=>{
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();setDirection(b.dataset.dir);
 });
});

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:"up",w:"up",W:"up",
  ArrowDown:"down",s:"down",S:"down",
  ArrowLeft:"left",a:"left",A:"left",
  ArrowRight:"right",d:"right",D:"right"
 };
 if(keys[e.key]){
  e.preventDefault();setDirection(keys[e.key]);
 }
 if(e.code==="Space"){
  e.preventDefault();togglePause();
 }
});

let touchStart=null;
canvas.addEventListener("touchstart",e=>{
 const t=e.touches[0];
 touchStart={x:t.clientX,y:t.clientY};
},{passive:true});

canvas.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const t=e.changedTouches[0];
 const dx=t.clientX-touchStart.x;
 const dy=t.clientY-touchStart.y;

 if(Math.max(Math.abs(dx),Math.abs(dy))>20){
  if(Math.abs(dx)>Math.abs(dy))
   setDirection(dx>0?"right":"left");
  else setDirection(dy>0?"down":"up");
 }
 touchStart=null;
},{passive:true});

// Periodic bonus food
setInterval(()=>{
 if(running&&!paused&&!over&&!bonusFood&&Math.random()<.25){
  spawnBonus();
 }
},1000);

reset();
updateStats();
</script>
</body>
</html>
